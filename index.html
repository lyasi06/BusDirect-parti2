<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BusDirect : gestion des réservations de sièges de la ligne Safi → Marrakech.">
    <title>BusDirect — Gestion des Réservations de Places</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="style.css" rel="stylesheet">
</head>
  <body class="min-h-screen bg-slate-100 text-slate-900 flex flex-col">

  <header class="border-b-4  bg-slate-900 text-white">
    <div class="mx-auto flex max-w-6xl flex-col gap-1 px-4 py-5 sm:flex-row sm:items-center sm:justify-between">
      
       <h1 class="text-2xl font-bold md:text-3xl text-amber-200">
         <img class="w-20 inline" src="./img/Gemini_Generated_Image_mb9sgimb9sgimb9s-removebg-preview.png" alt="BusDirect"><span class="text-blue-600">Bus</span><span class="text-yellow-500">Direct</span></h1>
         <strong><span class="text-blue-600 text-xl">Réseau national<span><span class="text-white text-xl"> ⮕</span><span class="text-yellow-500 text-xl">  · 20 trajets</span></strong>
    </div>
    </header>
    <main class="grow">
      <section class="grid grid-cols-1 justify-center items-center gap-4 sm:grid-cols-3">
      <div class="border-2  border-slate-300 bg-white rounded-lg h-28 w-96 p-7 ml-72">
        <p class="text-sm  text-slate-700">Recette totale du réseau</p>
        <p id="disponible" class="text-3xl  font-bold text-emerald-700">0 DH</p>
      </div>
      
      <div class="border-2 ml-80 w-96 border-slate-300 bg-white rounded-lg h-28 p-7 m-5">
        <p class="text-sm  text-slate-700">Passagers du réseau</p>
        <p id="recette" class="text-3xl font-bold">0</p>
      </div>
    </section>
    <section class="rounded-xl border h-76 m-7 border-slate-300 bg-white p-4 shadow-sm sm:p-6">
    <form>
      <div>
      <strong><label for="recherch">Rechercher une ville:</label></strong>
      <input type="text" name="recherch" id="recherch" placeholder="Ex=Safi-Marrakech" class="w-full rounded-lg border border-slate-500 bg-white px-3 py-2 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-600">
      <button type=""></button>
      </div>
      <div class="mb-5">
      <strong><label for="status">Statut</label></strong>
      <select name="status" id="status" class="w-full rounded-lg border border-slate-500 bg-white px-3 py-2 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-600">
      <label for="status">Statut</label>
        <option value="1">Tous</option>
        <option value="2">Disponible</option>
        <option value="3">Complet</option>
      </select>
      </div>
    </form>
  </section>
    <section id="listeTrajets" class="rounded-xl border h-76 m-7 border-slate-300 bg-white p-4 shadow-sm sm:p-6">
      </section>
      <nav id="pagination" class="flex justify-center gap-2"></nav>
      
      </main>
    <footer class=" bg-slate-900 text-slate-300 py-4 text-center w-full ">
        <p>@2026.BusDirect</p>
    </footer>
    <script type="module" src="./js/main-trajets.js"></script>
</body>
</html>
